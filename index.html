<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16235a">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="전자야장">
<title>멸종위기종 전자야장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --navy:#16235a;--navy2:#24387f;--navy-soft:#e8ecf7;
  --ink:#141a2b;--muted:#646b7d;--line:#dfe3ec;--bg:#f4f6fb;--card:#fff;
  --plant:#2d7a4f;--plant-soft:#e5f2ea;--insect:#b36a0e;--insect-soft:#faefdf;
  --danger:#c0352b;--ok:#2d7a4f;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Roboto,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
[hidden]{display:none!important}

/* ---------- MAP SCREEN ---------- */
#map{position:fixed;inset:0;z-index:1;background:#dfe5ee;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wm{position:fixed;inset:0;z-index:400;pointer-events:none;opacity:.5}
#shield{position:fixed;inset:0;z-index:450;background:var(--navy);display:none;
  align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
#shield.on{display:flex}
#shield img{width:72px;height:72px;border-radius:16px;margin-bottom:12px}
.fab-row{position:fixed;z-index:500;display:flex;gap:8px;align-items:center}
.top-l{top:calc(12px + var(--sat));left:12px}
.top-r{top:calc(12px + var(--sat));right:12px}
.seg{display:flex;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(20,30,60,.18);padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
#btnInstall{border:0;background:rgba(255,255,255,.95);color:var(--navy);font-size:12px;font-weight:700;
  padding:6px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(20,30,60,.18);display:flex;gap:4px;align-items:center}
#btnMenu{width:46px;height:46px;border:0;border-radius:13px;background:var(--navy);color:#fff;
  display:grid;place-items:center;box-shadow:0 4px 14px rgba(22,35,90,.35)}
#btnAdd{position:fixed;z-index:500;right:18px;bottom:calc(22px + var(--sab));width:62px;height:62px;border-radius:50%;
  border:0;background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(22,35,90,.4);display:grid;place-items:center;
  animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#btnMenu{animation:float 3.2s ease-in-out infinite .6s}
.mini-btn{position:fixed;z-index:500;left:14px;width:44px;height:44px;border-radius:12px;border:0;background:#fff;color:var(--navy);
  box-shadow:0 2px 10px rgba(20,30,60,.2);display:grid;place-items:center}
#btnLocate{bottom:calc(24px + var(--sab))}
#btnFit{bottom:calc(76px + var(--sab))}
#countChip{position:fixed;z-index:500;left:66px;bottom:calc(32px + var(--sab));background:rgba(255,255,255,.95);
  padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--navy);box-shadow:0 2px 8px rgba(20,30,60,.15)}
.leaflet-control-attribution{font-size:9px!important}
.leaflet-bottom.leaflet-right{bottom:calc(var(--sab));right:96px}
.pt{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.pt.plant{background:var(--plant)}.pt.insect{background:var(--insect)}
.pt.sp{box-shadow:0 0 0 2px var(--navy),0 1px 5px rgba(0,0,0,.45)}
.bub{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.leaflet-tooltip.lbl{pointer-events:auto;cursor:pointer}
.plist{max-height:240px;overflow:auto;min-width:200px}.plist .rec{padding:8px 10px}
.leaflet-tooltip.lbl{background:rgba(255,255,255,.94);border:0;border-radius:8px;padding:3px 7px;font-size:11px;line-height:1.3;
  box-shadow:0 1px 6px rgba(0,0,0,.25);color:var(--ink);text-align:center;font-weight:600}
.leaflet-tooltip.lbl b{font-weight:800}
.leaflet-tooltip.lbl .d{font-weight:500;color:var(--muted);font-size:10px}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2a6df4;border:3px solid #fff;box-shadow:0 0 0 6px rgba(42,109,244,.25)}
.pop h4{margin:0 0 4px;font-size:15px}
.pop .m{color:var(--muted);font-size:12px;margin-bottom:8px}
.pop .bt{display:flex;gap:6px}

/* ---------- GENERIC ---------- */
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;background:var(--navy);color:#fff;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:var(--navy-soft);color:var(--navy)}
.btn.line{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.red{background:#fdecea;color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.backdrop{position:fixed;inset:0;background:rgba(10,16,40,.45);z-index:600;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.on{opacity:1;pointer-events:auto}

/* ---------- DRAWER ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,90vw);z-index:700;background:var(--bg);
  transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  box-shadow:-8px 0 30px rgba(10,16,40,.25)}
#drawer.on{transform:none}
.dr-head{background:var(--navy);color:#fff;padding:calc(14px + var(--sat)) 16px 0}
.dr-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dr-title h2{margin:0;font-size:18px}
.icon-btn{width:38px;height:38px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.dr-tabs{display:flex;gap:4px}
.dr-tabs button{flex:1;border:0;background:none;color:rgba(255,255,255,.7);padding:10px 0;font-weight:700;border-bottom:3px solid transparent}
.dr-tabs button.on{color:#fff;border-color:#fff}
.dr-body{flex:1;overflow:auto;padding:14px 14px calc(24px + var(--sab))}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search input{flex:1;border:0;outline:0;padding:12px 0;background:none}
.fchips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.res-meta{font-size:12px;color:var(--muted);margin:4px 2px 8px}
.rec{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);display:block;width:100%;text-align:left}
.rec .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.rec .s{color:var(--muted);font-size:12.5px;margin-top:3px}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.tag.plant{background:var(--plant-soft);color:var(--plant)}.tag.insect{background:var(--insect-soft);color:var(--insect)}
mark{background:#ffe58a;color:inherit;padding:0 1px;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:36px 10px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:14px}
.bars .b{display:grid;grid-template-columns:minmax(70px,38%) 1fr auto;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}
.bars .b span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .tr{height:10px;background:#eef1f7;border-radius:5px;overflow:hidden}
.bars .fill{height:100%;border-radius:5px;background:var(--navy2)}
.bars .n{font-variant-numeric:tabular-nums;font-weight:700;min-width:24px;text-align:right}
table.st{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.st th,table.st td{padding:6px 4px;border-bottom:1px solid #eef0f5;text-align:right;white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left;white-space:normal}
table.st th{color:var(--muted);font-weight:600}
.tbl-wrap{overflow-x:auto}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.st-top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.card h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bp-btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:8px;font-size:12px;font-weight:700;padding:5px 9px;white-space:nowrap}
.bp-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bp{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.bp-t{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:4px}
.bp-leg{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
.filters select,.set input{width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.set label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 4px}
.set .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.hint{font-size:12px;color:var(--muted)}

/* ---------- FULL SCREENS ---------- */
.screen{position:fixed;inset:0;z-index:800;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.screen.on{transform:none}
.sc-head{background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 10px 10px;display:flex;align-items:center;gap:8px}
.sc-head h2{flex:1;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taxa{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(24px + var(--sab))}
.taxa p{text-align:center;color:var(--muted);margin:0 0 18px}
.taxa-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.taxon{aspect-ratio:1/1.1;border-radius:24px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  font-size:22px;font-weight:800;box-shadow:0 6px 20px rgba(20,30,60,.12);transition:transform .15s}
.taxon:active{transform:scale(.97)}
.taxon.plant{background:var(--plant-soft);color:var(--plant);border:2px solid #bfe0cb}
.taxon.insect{background:var(--insect-soft);color:var(--insect);border:2px solid #f0d3a7}
.taxon small{font-size:12px;font-weight:600;opacity:.8}
.draft-box{margin-top:20px;background:#fff;border:1px dashed var(--navy2);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.draft-box div{flex:1;font-size:13px}

/* form */
.ftabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none;flex-shrink:0}
.ftabs::-webkit-scrollbar{display:none}
.ftabs button{flex-shrink:0;border:0;background:none;padding:12px 14px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.ftabs button.on{color:var(--navy);border-color:var(--navy)}
.ftabs button.na{color:#b5bac6}
#fbody{flex:1;overflow:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(10px + var(--sab));background:#fff;border-top:1px solid var(--line)}
.ffoot .btn{flex:1}
.sec{font-size:13px;font-weight:800;color:var(--navy);margin:18px 2px 8px;display:flex;align-items:center;gap:6px}
.sec:first-child{margin-top:4px}
.sec::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--navy)}
.fld{display:block;margin-bottom:12px}
.fld>span,.lab{display:block;font-size:12.5px;font-weight:700;color:#3d4458;margin-bottom:5px}
.req{color:var(--danger)}
.inrow{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.inrow:focus-within{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(36,56,127,.12)}
.inrow input,.inrow select{flex:1;min-width:0;border:0;outline:0;padding:11px 12px;background:none}
.inrow .u{padding:0 12px;color:var(--muted);font-size:13px}
.inrow .nb{border:0;background:var(--navy-soft);color:var(--navy);font-size:12px;font-weight:700;padding:0 10px;align-self:stretch}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;resize:vertical;outline:0;background:#fff}
textarea:focus{border-color:var(--navy2)}
.row{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.row .inrow input[type=time]{padding-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;color:#3d4458}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on::before{content:"✓ "}
.chips.radio .chip.on::before{content:"● "}
.chips.list{flex-direction:column}
.chips.list .chip{border-radius:11px;text-align:left;padding:9px 12px}
.chip .d{display:block;font-weight:500;font-size:12px;opacity:.75}
.xtra{margin-top:6px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;outline:0;background:#fffdf3}
.auto-card{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:14px;margin-bottom:6px}
.auto-card .btn{background:#fff;color:var(--navy);width:100%;padding:13px}
.auto-card p{margin:0 0 10px;font-size:12.5px;opacity:.85}
#autoStat{margin-top:10px;font-size:12.5px;display:grid;gap:3px}
#autoStat:empty{display:none}
.coord{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:12px}
.coord .lab{display:flex;justify-content:space-between;align-items:center}
.dms{display:flex;align-items:center;gap:4px;margin:6px 0}
.dms .ax{width:22px;font-weight:800;color:var(--navy)}
.dms input{flex:0 0 54px;width:54px;min-width:0;padding:9px 6px;border:1px solid var(--line);border-radius:9px;text-align:center;outline:0;font-variant-numeric:tabular-nums}
.dms i{font-style:normal;color:var(--muted)}
.dec{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cbtns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:10px}
.item-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;color:var(--navy);margin-bottom:6px}
.co-row{display:grid;grid-template-columns:1fr 92px 36px;gap:6px;margin-bottom:6px;align-items:center}
.co-row input,.co-row select{padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;min-width:0;background:#fff;outline:0}
.del{border:0;background:#fdecea;color:var(--danger);border-radius:9px;height:38px;font-weight:800}
.tree-g{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;overflow:hidden}
.tree-g summary{padding:11px 14px;font-weight:800;list-style:none;display:flex;justify-content:space-between}
.tree-g summary::-webkit-details-marker{display:none}
.tree-g summary .cnt{background:var(--navy);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px}
.tree-g summary .cnt:empty{display:none}
.tree-sub{padding:4px 14px 12px}
.tree-sub .lab{color:var(--muted);font-weight:600}
.tree-sel{background:#fff;border:1px dashed var(--navy2);border-radius:11px;padding:9px 12px;font-size:13px;margin-bottom:8px;color:var(--navy)}
.tree-g summary .cnt{font-weight:700}
.note{background:var(--navy-soft);color:var(--navy);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.note.big{padding:28px 18px;text-align:center;font-size:14px}
.prev{background:#fff7e0;border:1px solid #f1dca0;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.thumbs .th{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px}
.sketch-prev{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;display:block}
.calc{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:12px}

/* modal */
.modal{position:fixed;inset:0;z-index:950;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .bg{position:absolute;inset:0;background:rgba(10,16,40,.55)}
.modal .box{position:relative;background:#fff;border-radius:18px;max-width:440px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .box h3{margin:0 0 10px;font-size:17px}
.modal .acts{display:flex;gap:8px;margin-top:16px}
.modal .acts .btn{flex:1}
.modal.full .box{max-width:none;height:100%;max-height:none;border-radius:0;padding:0;display:flex;flex-direction:column}
.modal.full{padding:0}
.warn .box{text-align:center;border-top:6px solid var(--danger)}
.warn .ic{width:56px;height:56px;border-radius:50%;background:#fdecea;color:var(--danger);display:grid;place-items:center;margin:4px auto 12px;font-size:28px}
.warn p{font-size:16px;font-weight:700;line-height:1.55;margin:0}
.steps{margin:6px 0 0;padding-left:20px}.steps li{margin:6px 0}
.dt h4{font-size:13px;color:var(--navy);margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--navy-soft)}
.dt dl{margin:0;display:grid;grid-template-columns:112px 1fr;gap:5px 10px;font-size:13px}
.dt dt{color:var(--muted)}.dt dd{margin:0;word-break:break-word}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sab));transform:translateX(-50%) translateY(20px);opacity:0;z-index:2000;
  background:#141a2b;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.cross{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:500;pointer-events:none}
.sk-tools{display:flex;gap:6px;padding:10px;background:#fff;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center;padding-bottom:calc(10px + var(--sab))}
.sk-tools .sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sk-tools .sw.on{box-shadow:0 0 0 2px var(--navy)}
#skc{flex:1;touch-action:none;background:#fff;width:100%}
#printArea{display:none}
@media print{
  body:not(.printing) *{visibility:hidden!important}
  body:not(.printing)::after{content:"멸종위기 야생생물의 출현좌표는 화면캡쳐가 금지되어 있습니다";visibility:visible;position:fixed;top:40%;left:0;right:0;text-align:center;font-size:22px}
  @page{size:A4;margin:12mm}

/* 라벨이 겹치는 지점은 원형으로 펼쳐 지시선으로 실제 위치와 연결.
   한 묶음이 RING_MAX건을 넘으면 개수 버튼으로 표시 → 누르면 확대, 최대 확대에서는 목록 */
const LBL_W = 112, LBL_H = 40, RING_MAX = 10;
function drawMarkers() {
  PTS = RECS.filter(r => num(r.f.lat) != null && num(r.f.lon) != null);
  $('#countChip').textContent = `조사지점 ${PTS.length}`;

const tipHTML = r => `<span class="d">${esc(dotDate(r.f.date))}</span><br><b>${esc(r.f.species || '(종명 미기재)')}</b>`;
const popHTML = r => `<div class="pop"><h4>${esc(r.f.species || '')}</h4><div class="m">${r.taxon === 'plant' ? '식물' : '곤충'} · ${esc(dotDate(r.f.date))} · ${esc(r.f.serial || '')}<br>${esc(r.f.chiefName || '')} · 개체수 ${esc(r.f.count ?? '-')}</div>
  <div class="bt"><button class="btn sm" onclick="showDetail('${r.id}')">상세</button><button class="btn sm ghost" onclick="openForm('${r.taxon}','${r.id}')">수정</button></div></div>`;
const TIP_OFF = { top: [0, -9], bottom: [0, 9], left: [-9, 0], right: [9, 0] };
function addPin(r, ll, dir = 'top', spread) {
  const m = L.marker(ll || [+r.f.lat, +r.f.lon], { riseOnHover: true, icon: L.divIcon({ className: '', html: `<div class="pt ${r.taxon}${spread ? ' sp' : ''}"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }) })
    .bindTooltip(tipHTML(r), { permanent: true, direction: dir, offset: TIP_OFF[dir], className: 'lbl', interactive: true })
    .bindPopup(() => popHTML(r));
  m.on('tooltipopen', e => { const el = e.tooltip.getElement && e.tooltip.getElement(); if (el) el.onclick = () => m.openPopup(); });
  m.addTo(mk); MK[r.id] = m; return m;
}
function addBubble(list, ll) {
  const n = list.length, b = L.latLngBounds(list.map(r => [+r.f.lat, +r.f.lon]));
  const m = L.marker(ll, { icon: L.divIcon({ className: '', html: `<div class="bub">${n}</div>`, iconSize: [40, 40], iconAnchor: [20, 20] }) })
    .bindTooltip(`<b>${n}건 중첩</b><br><span class="d">눌러서 펼치기</span>`, { permanent: true, direction: 'top', offset: [0, -18], className: 'lbl' });
  m.on('click', () => {
    const same = b.getNorthEast().distanceTo(b.getSouthWest()) < 2;
    if (!same && map.getZoom() < map.getMaxZoom() - 1) return map.fitBounds(b, { padding: [90, 90], maxZoom: map.getMaxZoom() });
    L.popup({ maxHeight: 320 }).setLatLng(ll).setContent(`<div class="pop"><h4>이 위치의 기록 ${n}건</h4><div class="plist">${list.slice().sort((x, y) => (y.f.date || '').localeCompare(x.f.date || '')).map(r =>
      `<button class="rec" onclick="showDetail('${r.id}')"><div class="t"><span class="tag ${r.taxon}">${r.taxon === 'plant' ? '식물' : '곤충'}</span>${esc(r.f.species || '')}</div><div class="s">${esc(dotDate(r.f.date))} · ${esc(r.f.serial || '')}</div></button>`).join('')}</div></div>`).openOn(map);
  });
  m.addTo(mk);
}
function layoutMarkers() {
  mk.clearLayers(); for (const k in MK) delete MK[k];
  if (!PTS.length) return;
  const z = map.getZoom();
  const P = PTS.map(r => map.project([+r.f.lat, +r.f.lon], z));
  const par = P.map((_, i) => i); const find = i => par[i] === i ? i : (par[i] = find(par[i]));
  const ord = P.map((_, i) => i).sort((a, b) => P[a].x - P[b].x);
  for (let a = 0; a < ord.length; a++) for (let b = a + 1; b < ord.length; b++) {
    const i = ord[a], j = ord[b]; if (P[j].x - P[i].x >= LBL_W) break;
    if (Math.abs(P[j].y - P[i].y) < LBL_H) par[find(i)] = find(j);
  }
  const groups = {}; P.forEach((_, i) => (groups[find(i)] ||= []).push(i));
  Object.values(groups).forEach(g => {
    if (g.length === 1) return addPin(PTS[g[0]]);
    const c = g.reduce((s, i) => ({ x: s.x + P[i].x / g.length, y: s.y + P[i].y / g.length }), { x: 0, y: 0 });
    const cll = map.unproject(L.point(c.x, c.y), z);
    if (g.length > RING_MAX) return addBubble(g.map(i => PTS[i]), cll);
    // 실제 위치의 방향을 최대한 유지하며 원 위 등간격 배치
    const angOf = i => (Math.abs(P[i].x - c.x) + Math.abs(P[i].y - c.y) < 0.5) ? null : Math.atan2(P[i].y - c.y, P[i].x - c.x);
    const sorted = g.slice().sort((i, j) => (angOf(i) ?? 0) - (angOf(j) ?? 0) || (PTS[i].f.date || '').localeCompare(PTS[j].f.date || ''));
    const a0 = angOf(sorted[0]) ?? -Math.PI / 2, R = Math.max(56, 21 * g.length);
    L.circleMarker(cll, { radius: 4, color: '#16235a', weight: 2, fillColor: '#fff', fillOpacity: 1, interactive: false }).addTo(mk);
    sorted.forEach((i, k) => {
      const ang = a0 + 2 * Math.PI * k / g.length, r = PTS[i];
      const ll = map.unproject(L.point(c.x + R * Math.cos(ang), c.y + R * Math.sin(ang)), z);
      const d = ((ang * 180 / Math.PI) % 360 + 540) % 360 - 180;
      const dir = d > -135 && d <= -45 ? 'top' : d > -45 && d < 45 ? 'right' : d >= 45 && d < 135 ? 'bottom' : 'left';
      L.polyline([[+r.f.lat, +r.f.lon], ll], { color: '#16235a', weight: 1.6, opacity: .75, dashArray: '4 3', interactive: false }).addTo(mk);
      L.circleMarker([+r.f.lat, +r.f.lon], { radius: 3, color: '#16235a', weight: 1, fillColor: r.taxon === 'plant' ? '#2d7a4f' : '#b36a0e', fillOpacity: 1, interactive: false }).addTo(mk);
      addPin(r, ll, dir, true);
    });
  });
}

async function saveFile(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportCSV(taxon) {
  const list = RECS.filter(r => r.taxon === taxon); if (!list.length) return toast('내보낼 자료가 없습니다');
  const fields = []; SCHEMA[taxon].forEach((tab, ti) => tab.flatMap(flatFields).forEach(fd => fields.push([`${ti + 1}.${fd.dl || fd.label}`, fd])));
  const head = ['분류군', ...fields.map(x => x[0]), '실측위도(십진)', '실측경도(십진)', '사진수', '최종수정'];
  const q = v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const rows = list.map(r => [taxon === 'plant' ? '식물' : '곤충', ...fields.map(([, fd]) => fmtVal(fd, r.f, true)), r.f.lat ?? '', r.f.lon ?? '', (r.f.photos || []).length, new Date(r.updatedAt).toLocaleString('ko-KR')]);

  saveFile(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `현지조사표_${taxon === 'plant' ? '식물' : '곤충'}_${todayStr().replace(/-/g, '')}.csv`);

  if (act === 'subDel') { f.sub.splice(+b.dataset.i, 1); changed('sub'); renderTab(); }
  if (act === 'coAdd') { f.co.push({}); changed('co'); renderTab(); const ins = $$('.co-row input', fb); ins.length && ins[ins.length - (F.taxon === 'plant' ? 1 : 2)].focus(); }
  if (act === 'coDel') { f.co.splice(+b.dataset.i, 1); changed('co'); renderTab(); }
  if (act === 'sketch') openSketch();
  if (act === 'sketchDel') { f.sketch = null; changed('sketch'); renderTab(); }
  if (act === 'photoDel') { f.photos.splice(+b.dataset.i, 1); changed('photos'); renderTab(); }
  if (act === 'aspect') measureAspect(b);
  if (act === 'slope') measureSlope(b);

const round7 = v => Math.round(v * 1e7) / 1e7;

/* ---------- 저장 ---------- */
$('#fSave').onclick = async () => {
  const f = F.f;
  if (!f.species || !f.species.trim()) { setTab(0); return toast('조사종명(국명)을 입력하세요'); }
  if (!f.date) { setTab(0); return toast('조사일자를 입력하세요'); }
  if (num(f.lat) == null || num(f.lon) == null) { if (!(await confirmBox('실측 좌표가 없어 지도에 표시되지 않습니다.<br>그대로 저장할까요?', '저장'))) return; }
  else if (!f.src) { setTab(0); return toast('좌표값 취득원을 하나 선택하세요'); }
  if (!f.serial) f.serial = autoSerial();
  if (!f.tEnd) f.tEnd = nowHM();
  const old = RECS.find(r => r.id === F.id);
  const rec = { id: F.id, taxon: F.taxon, createdAt: old ? old.createdAt : Date.now(), updatedAt: Date.now(), f };
  try { await DB.put(rec); } catch (er) { return toast('저장 실패: 저장공간을 확인하세요'); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}
  if (!SET.name && f.chiefName) { SET.name = f.chiefName; SET.org = f.chiefOrg || ''; saveSet(); updateWatermark(); }
  localStorage.removeItem(DRAFT_KEY); localStorage.removeItem(DRAFT_KEY + '-m');
  F.dirty = false; const id = F.id;
  await reload(); toast('야장을 저장했습니다');
  closeAllTo(0); setTimeout(() => flyTo(id), 400);
};

/* =========================================================
   자동 기입 (GPS · 날씨 · 주소 · 고도)
   ========================================================= */
function getPosition(maxWait = 12000) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('이 기기는 위치 기능을 지원하지 않습니다'));
    let best = null; const done = () => { navigator.geolocation.clearWatch(w); clearTimeout(t); best ? res(best) : rej(new Error('위치를 확인하지 못했습니다. 위치 권한과 GPS를 확인하세요')); };
    const w = navigator.geolocation.watchPosition(p => {
      if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
      const s = $('#autoStat'); if (s && s.dataset.live) s.firstChild.textContent = `📡 GPS 측위 중… 현재 정확도 ±${Math.round(best.coords.accuracy)}m`;
      if (best.coords.accuracy <= 8) done();
    }, er => { if (!best) { clearTimeout(t); navigator.geolocation.clearWatch(w); rej(new Error(er.code === 1 ? '위치 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요' : '위치를 확인하지 못했습니다')); } },
      { enableHighAccuracy: true, maximumAge: 0, timeout: maxWait });
    const t = setTimeout(done, maxWait);
  });
}
const WX = c => c <= 1 ? ['맑음', c === 0 ? '맑음' : '대체로 맑음'] : c <= 3 ? ['흐림', c === 2 ? '구름 조금' : '흐림'] : c <= 48 ? ['흐림', '안개'] :
  c <= 67 || (c >= 80 && c <= 82) ? ['비', c >= 80 ? '소나기' : c <= 57 ? '이슬비' : '비'] : c <= 77 || c === 85 || c === 86 ? ['기타', '눈'] : ['비', '뇌우'];
async function fetchJSON(u, ms = 9000) { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); try { const r = await fetch(u, { signal: c.signal }); if (!r.ok) throw 0; return await r.json(); } finally { clearTimeout(t); } }
function addrFrom(a) {
  const parts = [a.province || a.state, a.city, a.county, a.borough || a.city_district, a.town || a.suburb, a.village || a.quarter, a.hamlet || a.neighbourhood, a.road, a.house_number];
  return parts.filter((v, i, s) => v && s.indexOf(v) === i).join(' ');
}
async function autoFill(btn) {
  const f = F.f, st = $('#autoStat'); btn.disabled = true;
  const line = (ok, t) => `<div>${ok === 1 ? '✅' : ok === 0 ? '⚠️' : '⏳'} ${t}</div>`;
  f.date = todayStr(); if (!f.tStart) f.tStart = nowHM();
  st.dataset.live = 1; st.innerHTML = `<div>📡 GPS 측위 중…</div>`;
  let p; try { p = await getPosition(); } catch (er) { st.innerHTML = line(0, er.message); btn.disabled = false; delete st.dataset.live; renderKeep(); return; }
  delete st.dataset.live;
  const { latitude: la, longitude: lo, accuracy, altitude, altitudeAccuracy } = p.coords;
  f.lat = round7(la); f.lon = round7(lo); f.gpsAcc = Math.round(accuracy);
  if (!f.src) { f.src = 'GPS'; if (F.taxon === 'insect' && !f['src__GPS']) f['src__GPS'] = '스마트폰 내장 GPS'; }
  const msgs = [line(1, `조사일자 ${dotDate(f.date)} · 시작 ${f.tStart}`), line(1, `좌표 N ${dmsStr(la)} E ${dmsStr(lo)} (±${Math.round(accuracy)}m)`)];
  st.innerHTML = msgs.join('') + line(2, '날씨·주소·고도 조회 중…');
  if (!navigator.onLine) { msgs.push(line(0, '오프라인 상태라 날씨·주소·고도는 기입하지 못했습니다. 연결 후 다시 눌러 주세요')); }
  else {
    const [wx, geo, el] = await Promise.allSettled([
      fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms&timezone=Asia%2FSeoul`),
      fetchJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${la}&lon=${lo}&zoom=18&addressdetails=1&accept-language=ko`),
      fetchJSON(`https://api.open-meteo.com/v1/elevation?latitude=${la}&longitude=${lo}`)
    ]);
    if (wx.status === 'fulfilled' && wx.value.current) { const c = wx.value.current, [w, d] = WX(c.weather_code);
      f.weather = w; if (w === '기타') f['weather__기타'] = d; f.temp = Math.round(c.temperature_2m * 10) / 10;
      f.wxNote = `${d}, 습도 ${c.relative_humidity_2m}%, 풍속 ${c.wind_speed_10m}m/s (Open-Meteo ${c.time.slice(11)})`;
      msgs.push(line(1, `날씨 ${d} · 기온 ${f.temp}℃`)); } else msgs.push(line(0, '날씨 조회 실패'));
    if (geo.status === 'fulfilled' && geo.value.address) { f.addr = addrFrom(geo.value.address); msgs.push(line(1, `행정구역 ${f.addr}`)); } else msgs.push(line(0, '행정구역 조회 실패 (직접 입력하세요)'));
    let ev = null, src = '';
    if (altitude != null && (altitudeAccuracy == null || altitudeAccuracy <= 15)) { ev = Math.round(altitude); src = 'GPS'; }
    else if (el.status === 'fulfilled' && el.value.elevation) { ev = Math.round(el.value.elevation[0]); src = '수치표고모델(90m)'; }
    if (ev != null) { f.elev = ev; msgs.push(line(1, `고도 ${ev}m (${src})`)); } else msgs.push(line(0, '고도 조회 실패'));
  }
  F.dirty = true; if (!F.serialManual) f.serial = autoSerial(); saveDraft();
  renderKeep(); $('#autoStat').innerHTML = msgs.join(''); btn = $('[data-act="auto"]'); if (btn) btn.disabled = false;
}
function renderKeep() { const s = $('#autoStat') && $('#autoStat').innerHTML; renderTab(); if (s) $('#autoStat').innerHTML = s; }

/* ---------- 지도에서 위치 지정 ---------- */
function openPicker(latP, lonP) {
  const la = num(getP(latP)) ?? num(F.f.lat), lo = num(getP(lonP)) ?? num(F.f.lon);
  const m = showModal(`<div class="sc-head"><button class="icon-btn" data-x>✕</button><h2>지도에서 위치 지정</h2><button class="btn sm" data-ok style="background:#fff;color:var(--navy)">이 위치로</button></div>
    <div style="position:relative;flex:1"><div id="pmap" style="position:absolute;inset:0"></div>
    <svg class="cross" viewBox="0 0 34 34"><circle cx="17" cy="17" r="6" fill="none" stroke="#c0352b" stroke-width="3"/><path d="M17 0v10M17 24v10M0 17h10M24 17h10" stroke="#c0352b" stroke-width="3"/></svg></div>`, { cls: 'full' });
  const pm = L.map('pmap', { zoomControl: false }).setView(la != null ? [la, lo] : map.getCenter(), la != null ? 17 : Math.max(map.getZoom(), 8));
  (curLayer === 'sat' ? L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 18, crossOrigin: 'anonymous' }) : L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, crossOrigin: 'anonymous' })).addTo(pm);
  setTimeout(() => pm.invalidateSize(), 60);
  $('[data-x]', m.el).onclick = () => m.close();
  $('[data-ok]', m.el).onclick = () => { const c = pm.getCenter(); setP(latP, round7(c.lat)); setP(lonP, round7(c.lng)); changed(latP); m.close(); setTimeout(renderTab, 30); };
}

/* ---------- 나침반 / 경사계 ---------- */
async function sensorPerm() { if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) { const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') throw new Error('센서 권한이 거부되었습니다'); } }
function sample(evName, fn, ms = 2000) {
  return new Promise((res, rej) => { const v = []; const h = e => { const x = fn(e); if (x != null && !isNaN(x)) v.push(x); };
    window.addEventListener(evName, h); setTimeout(() => { window.removeEventListener(evName, h); v.length ? res(v) : rej(new Error('센서 값을 읽지 못했습니다')); }, ms); });
}
async function measureAspect(b) {
  try { await sensorPerm(); b.textContent = '휴대폰 윗부분을 경사면 아래쪽(사면 방향)으로 향하게 유지…';
    const ev = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
    const v = await sample(ev, e => e.webkitCompassHeading != null ? e.webkitCompassHeading : (e.absolute || ev === 'deviceorientationabsolute') && e.alpha != null ? (360 - e.alpha) % 360 : null);
    const s = v.reduce((a, d) => [a[0] + Math.sin(d * Math.PI / 180), a[1] + Math.cos(d * Math.PI / 180)], [0, 0]);
    F.f.aspect = Math.round(((Math.atan2(s[0], s[1]) * 180 / Math.PI) + 360) % 360); changed('aspect'); renderTab(); toast(`방위 ${F.f.aspect}° 입력 (${compass(F.f.aspect)})`);
  } catch (er) { toast(er.message); renderTab(); }
}
async function measureSlope(b) {
  try { await sensorPerm(); b.textContent = '휴대폰을 경사면에 평평하게 놓고 기다리는 중…';
    const v = await sample('deviceorientation', e => e.beta == null ? null : Math.acos(Math.cos(e.beta * Math.PI / 180) * Math.cos(e.gamma * Math.PI / 180)) * 180 / Math.PI);
    F.f.slope = Math.round(v.reduce((a, x) => a + x, 0) / v.length); changed('slope'); renderTab(); toast(`경사도 ${F.f.slope}° 입력`);
  } catch (er) { toast(er.message); renderTab(); }
}

/* ---------- 사진 ---------- */
function compress(file, max = 1600, q = .75) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', q)); }; img.onerror = rej; img.src = URL.createObjectURL(file); });
}
async function addPhotos(files) { for (const fl of files) { try { F.f.photos.push(await compress(fl)); } catch (_) {} } changed('photos'); renderTab(); }

/* ---------- 약도 그리기 ---------- */
function openSketch() {
  const m = showModal(`<div class="sc-head"><button class="icon-btn" data-x>✕</button><h2>${F.taxon === 'plant' ? '입지위치도' : '조사지 약도'}</h2><button class="btn sm" data-ok style="background:#fff;color:var(--navy)">완료</button></div>
    <canvas id="skc"></canvas>
    <div class="sk-tools">${['#141a2b', '#c0352b', '#1f5fd1', '#2d7a4f'].map((c, i) => `<button class="sw ${i ? '' : 'on'}" data-c="${c}" style="background:${c}"></button>`).join('')}
      <button class="btn sm line" data-w>굵게</button><button class="btn sm line" data-t>글자</button><button class="btn sm line" data-u>↶ 취소</button><button class="btn sm red" data-clr>지우기</button></div>`, { cls: 'full', sticky: true });
  const cv = $('#skc', m.el), ctx = cv.getContext('2d'); let color = '#141a2b', width = 3, textMode = false; const hist = [];
  const fit = () => { const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
    if (F.f.sketch) { const im = new Image(); im.onload = () => { const s = Math.min(r.width / im.width, r.height / im.height); ctx.drawImage(im, 0, 0, im.width * s, im.height * s); }; im.src = F.f.sketch; } };
  setTimeout(fit, 50);
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  let drawing = false;
  cv.addEventListener('pointerdown', e => { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 30) hist.shift();
    const [x, y] = pt(e);
    if (textMode) { const t = prompt('넣을 글자 (예: 계곡, 집단A, 입구)'); if (t) { ctx.fillStyle = color; ctx.font = 'bold 16px sans-serif'; ctx.fillText(t, x, y); } textMode = false; $('[data-t]', m.el).classList.remove('ghost'); return; }
    drawing = true; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x, y); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); });
  cv.addEventListener('pointerup', () => drawing = false);
  m.el.addEventListener('click', e => { const t = e.target;
    if (t.dataset.c) { color = t.dataset.c; $$('.sw', m.el).forEach(s => s.classList.toggle('on', s === t)); }
    if ('w' in t.dataset) { width = width === 3 ? 7 : 3; t.textContent = width === 3 ? '굵게' : '가늘게'; }
    if ('t' in t.dataset) { textMode = !textMode; t.classList.toggle('ghost', textMode); if (textMode) toast('글자를 넣을 위치를 누르세요'); }
    if ('u' in t.dataset && hist.length) ctx.putImageData(hist.pop(), 0, 0);
    if ('clr' in t.dataset) { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); const r = cv.getBoundingClientRect(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height); }
    if ('x' in t.dataset) m.close();
    if ('ok' in t.dataset) { F.f.sketch = cv.toDataURL('image/jpeg', .8); changed('sketch'); m.close(); setTimeout(renderTab, 30); }
  });
}

/* =========================================================
   시작
   ========================================================= */
window.showDetail = showDetail; window.openForm = openForm;
(async () => {
  try { await DB.open(); await reload(); if (RECS.length) fitAll(); } catch (e) { toast('저장소를 열 수 없습니다: ' + e); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  if (!SET.name) setTimeout(() => toast('☰ 메뉴 > 설정·백업에서 조사자 정보를 먼저 입력해 두세요', 3500), 1200);
})();
